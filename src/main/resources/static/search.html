<!DOCTYPE html>
<html ng-app="pdfApp">
<head>
    <title>Search PDFs</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
    <style>

        body{
            font-family: Arial;
            margin: 20px;
        }

        input{
            width: 300px;
            padding: 8px;
        }

        button{
            padding: 8px 15px;
        }

        li{
            margin: 10px 0;
        }

        iframe{
            width: 100%;
            height: 700px;
            margin-top: 20px;
        }
         .loading-mask{

            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0,0,0,0.5);

            display: flex;
            justify-content: center;
            align-items: center;

            z-index: 9999;
        }

        .loader{

            width: 60px;
            height: 60px;

            border: 8px solid #f3f3f3;
            border-top: 8px solid blue;

            border-radius: 50%;

            animation: spin 1s linear infinite;
        }

        @keyframes spin {

            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }


    </style>

</head>

<body ng-controller="PdfController">

<h2>Search PDF Files</h2>
<!-- LOADING MASK -->

<div class="loading-mask"
     ng-show="loading">
    <div class="loader"></div>
</div>
<form ng-submit="search()">
    <input type="text"
           ng-model="keyword"
           placeholder="Enter PDF Name">

    <button type="submit">
        Search
    </button>
</form>
<div style="height: 200px;     overflow-y: auto;  border: 1px solid #ccc;">
<ul >
    <li ng-repeat="file in files">
        <a href=""
           ng-click="openPdf(file.FilePath)">
            {{file.FileName}}
        </a>
    </li>
</ul>
</div>
<div>
<iframe ng-if="pdfUrl"
        ng-src="{{pdfUrl}}">
</iframe>
</div>
</body>
</html>
